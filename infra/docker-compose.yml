name: event-platform

# Self-hosted stack. Run on your server (Docker required).
# Phase 0 ships the data services + Caddy. App service builds (web/worker)
# are enabled in Phase 11 once Dockerfiles are added.
#
#   docker compose --env-file ../.env up -d postgres redis minio
#   docker compose up -d caddy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventapp}
      POSTGRES_DB: ${POSTGRES_DB:-eventapp}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eventapp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Caddy obtains & renews Let's Encrypt certs automatically for every
    # company custom domain listed in the Caddyfile.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web

  # ─── Application services ───
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    expose:
      - "3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
  caddyconfig:
  uploads:
